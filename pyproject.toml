[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-game-reverse-lab"
version = "0.1.0"
description = "Safe, offline asset-format research toolkit for anime games"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{name = "Anime Game Reverse Lab contributors"}]
dependencies = []

[project.scripts]
erlab = "erlab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-game-reverse-lab"
version = "0.4.0"
description = "Reverse-game research workspace with pinned upstream projects and UnityPy integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{name = "Anime Game Reverse Lab contributors"}]
dependencies = []

[project.optional-dependencies]
unity = ["UnityPy==1.25.4"]

[project.scripts]
erlab = "erlab.cli:main"
erlab-unity = "erlab.unity_assets:main"
erlab-apk = "erlab.apk_audit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
